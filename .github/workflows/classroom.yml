name: Autograding Tests
'on':
- workflow_dispatch
- repository_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Basic docker tests
      id: basic-docker-tests
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Basic docker tests
        setup-command: ''
        command: docker run -t -v .:/project masteeve/logprog-2526
        timeout: 2
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        BASIC-DOCKER-TESTS_RESULTS: "${{steps.basic-docker-tests.outputs.result}}"
      with:
        runners: basic-docker-tests
